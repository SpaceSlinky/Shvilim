<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f3a">
  <script>try { if (localStorage.getItem('theme') === 'dark') { document.documentElement.classList.add('night'); document.querySelector('meta[name=theme-color]').content = '#101317'; } } catch (e) {}</script>
  <title>שבילים</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
</head>
<body>
<script>if (document.documentElement.classList.contains('night')) document.body.classList.add('night');</script>
  <div id="map"></div>

  <!-- עמודת הכלים ("אולר"): סגורה = רק ☰. משיכה למטה או הקשה פותחת; פעולה או הקשה על המפה סוגרת -->
  <!-- משטח הכלים ("אולר"): נשלף מלמעלה. סגור – רואים רק את ☰ בתחתית המשטח; משיכה למטה מורידה את כל המשטח -->
  <!-- משטח הכלים ("אולר"): משטח אחד שנשלף מלמעלה – הכלים, ולידם (כשיש מסלול) הסליידר להסתרת הרקע.
       בתחתית – פס עם חריץ למשיכה; סגור – רואים רק אותו -->
  <!-- כלים: עיגול ☰ בקצה הימני של שורת החיפוש (וכשאין חיפוש – באותו מקום). נגיעה – העיגולים גדלים במקומם,
       במרחקים שווים; משמאלם (במסלול / בתכנון) – הסתרת הרקע, מצוירת ישר על המפה. כשסגור – נשארים רק מה שצריך (מצפן כשהמפה מסובבת, מיקום כשזזת ממנו) -->
  <div id="controls">
    <button id="btn-menu" class="kmenu" title="כלים" aria-label="כלים" aria-expanded="false"><i></i><i></i><i></i></button>
    <div class="ktools">
      <div class="kcol">
          <button id="btn-fit" title="כל המסלול על המסך" aria-label="כל המסלול על המסך" hidden>
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none"/><path d="M8 15c2-1 2-5 4-6s3 1 4-1" fill="none"/></svg>
          </button>
          <!-- בידוד: רק דרכי עפר / רק שבילים מסומנים / שניהם; שניהם כבויים – מפה מלאה -->
          <button id="btn-iso-dirt" class="ly" title="רק דרכי עפר" aria-label="רק דרכי עפר" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M5 21c2-5 9-3 8-9s4-6 6-8" fill="none" stroke-dasharray="3 2.5"/></svg>
          </button>
          <button id="btn-iso-marked" class="ly mk" title="רק שבילים מסומנים" aria-label="רק שבילים מסומנים" aria-pressed="false">
            <svg viewBox="0 0 24 24"><g fill="none" stroke-width="2"><path class="c1" d="M2 16.5c2.5-5 6.5-3 7.5-7.5s3.5-5 7-5"/><path class="c2e" d="M4.6 19.1c2.5-5 6.5-3 7.5-7.5s3.5-5 7-5"/><path class="c2" d="M4.6 19.1c2.5-5 6.5-3 7.5-7.5s3.5-5 7-5"/><path class="c3" d="M7.2 21.7c2.5-5 6.5-3 7.5-7.5s3.5-5 7-5"/></g></svg>
          </button>
          <button id="btn-iso-bike" class="ly" title="רק שבילי אופניים" aria-label="רק שבילי אופניים" aria-pressed="false">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.6" fill="none"/><circle cx="18" cy="16" r="3.6" fill="none"/><path d="M6 16l4-7h6l2 7M10 9l3 7h-7M14.5 6.5H17" fill="none"/></svg>
          </button>
      </div>
      <!-- תצלום אוויר: למעלה – מפה; באמצע – תצלום מלא מתחת למפה; למטה – רק תצלום (מעל המפה) -->
      <div id="sat-v" class="vslider" aria-label="תצלום אוויר" role="slider" aria-valuemin="0" aria-valuemax="100">
          <div class="vs-track"><div class="vs-fill"></div><i class="vs-mid"></i><div class="vs-thumb"></div></div>
      </div>
      <div class="kcol2">
          <button id="btn-theme" title="בהיר / כהה" aria-label="בהיר / כהה">
            <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none"/></svg>
            <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4" fill="none"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none"/></svg>
          </button>
      </div>
    </div>
    <!-- מיקום – תמיד על המסך, מעל הדוק; מצפן – רק כשהמפה מסובבת / במצב מצפן -->
    <div id="fabs">
          <button id="btn-compass" title="מצפן: הקשה – סיבוב לפי כיוון הטלפון / צפון למעלה" aria-label="מצפן">
            <svg viewBox="0 0 24 24" id="compass-needle" class="needle"><path d="M12 3l4 9h-8z" class="n"/><path d="M12 21l-4-9h8z" class="s"/></svg>
          </button>
          <button id="btn-locate" title="המיקום שלי (לחיצה ארוכה: כיבוי GPS)" aria-label="המיקום שלי">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" fill="none"/></svg>
          </button>
    </div>
  </div>
  </div>

  <div id="toast" hidden></div>

  <!-- הדוק התחתון: משתנה לפי מה שעושים – בית (חיפוש / מסלולים / חדש), רשימת מסלולים, מסלול, תכנון -->
  <div id="dock" data-mode="lib"><div id="dock-in">
    <div id="dock-ask" class="dock-ask" hidden><span></span><button class="yes"></button><button class="no">המשך</button></div>
    <!-- ראשי = המסלולים: סגור – חיפוש ושורת "מסלולים"; פתוח (משיכה למעלה / נגיעה בשורה) – הרשימה במקום.
         נגיעה במסלול בוחרת; הכלים למטה פועלים על מה שנבחר -->
    <section data-mode="lib" hidden>
      <div class="grip lib-pull" aria-hidden="true"></div>
      <button id="lib-head" class="lib-head lib-pull" aria-expanded="false">מסלולים</button>
      <div id="lib-body" class="lib-body"><div>
        <div id="lib-list" class="dock-scroll"></div>
        <div id="lib-tools" class="lib-tools"></div>
        <p class="credits">נתוני המפה © תורמי OpenStreetMap · גובה: Mapzen/AWS · תצלום אוויר © Esri</p>
      </div></div>
    </section>

    <!-- מסלול: תצוגה מקדימה (לפני היציאה) או ניווט. שורת מספרים אחת שמשמעותה משתנה לפי המצב ולפי האצבע על הגרף -->
    <section data-mode="route" hidden>
      <button class="grip" id="r-grip" aria-label="גרף"></button>
      <!-- שם המסלול מימין, "יציאה" משמאל (בניווט – עוצרת את הניווט) -->
      <div class="dock-head r-head">
        <div class="r-title d-title"><b id="ri-name"></b></div>
        <button id="r-exit" class="r-exit">יציאה</button>
      </div>
      <div id="ri-stats" class="stats">
        <div><span id="st-l1" class="lbl"></span><span id="st-v1" class="v"></span></div>
        <div><span id="st-l2" class="lbl"></span><span id="st-v2" class="v"></span></div>
        <div><span id="st-l3" class="lbl"></span><span id="st-v3" class="v"></span></div>
        <div><span id="st-l4" class="lbl"></span><span id="st-v4" class="v"></span><button id="ri-pace" class="pace" hidden></button></div>
      </div>
      <div class="r-more">
        <canvas id="ri-profile" class="profile"></canvas>
      </div>
      <!-- תוספת למסלול (לחיצה ארוכה על המפה): הלוך וחזור / להמשיך משם -->
      <div id="dt-box" class="dt-box" hidden>
        <div id="dt-title" class="dt-title"></div>
        <div id="dt-info" class="dt-info"></div>
        <div id="dt-modes" class="dt-modes"><button data-m="back">הלוך וחזור</button><button data-m="on">להמשיך משם</button></div>
        <div class="dt-btns"><button id="dt-cancel">ביטול</button><button id="dt-ok" class="primary">הוספה למסלול</button></div>
      </div>
      <button id="ri-go" class="go primary">▶ יוצאים לדרך</button>
    </section>

    <!-- ניהול מפות (כשנבחרו משבצות במפה): במקום "מסלולים" – מה נבחר, וביטול · הורדה / עדכון · מחיקה; בזמן הורדה – סגירה · עצירה -->
    <section data-mode="areas" hidden>
      <div id="ab-info" class="ab-info"></div>
      <div class="lib-tools">
        <div class="tgrp">
          <button id="ab-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span>סגירה</span></button>
          <button id="ab-stop" class="danger" hidden><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg><span>עצירה</span></button>
          <button id="ab-upd" hidden><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>עדכון</span></button>
          <button id="ab-del" class="danger" hidden><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span>מחיקה</span></button>
        </div>
      </div>
    </section>

    <section data-mode="plan" hidden>
      <!-- שם המסלול: נוגעים ועורכים במקום (עט קטן ליד) -->
      <label class="pl-name-row"><input id="pl-name" placeholder="מסלול חדש" maxlength="50" autocomplete="off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></label>
      <p id="pl-hint" class="center"></p>
      <div class="stats">
        <div><span class="lbl">אורך</span><span id="pl-len" class="v">–</span></div>
        <div><span class="lbl"><svg class="arr" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 9.5L9.5 2.5M4 2.5h5.5V8"/></svg> עלייה</span><span id="pl-up" class="v">–</span></div>
        <div><span class="lbl"><svg class="arr" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 4v5.5H4"/></svg> ירידה</span><span id="pl-down" class="v">–</span></div>
        <div><span class="lbl">⏱ זמן</span><span id="pl-time" class="v">–</span><button id="pl-pace" class="pace"></button></div>
      </div>
      <canvas id="pl-profile" class="profile small-profile"></canvas>
      <!-- כלים בשורה אחת, כמו ברשימה: שמירה · ביטול | הליכה/אופניים (כפתור מתחלף) · הצמדה לשבילים (דלוק/כבוי) -->
      <div class="lib-tools pl-tools">
        <div class="tgrp">
          <button id="pl-done" class="primary"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>שמירה</span></button>
          <button id="pl-cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span>ביטול</span></button>
        </div>
        <div class="tgrp">
          <button id="pl-mode" title="הליכה / אופניים"><svg viewBox="0 0 24 24"></svg><span></span></button>
          <button id="pl-snap" class="tog" title="צמוד לשבילים"><svg viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0 0 12 0V4M6 4h3.5v8a2.5 2.5 0 0 0 5 0V4H18M6 8h3.5M14.5 8H18"/><path class="slash" d="M3 3l18 18"/></svg><span>לשבילים</span></button>
        </div>
      </div>
    </section>
  </div></div>

  <dialog id="plan-dlg">
    <form method="dialog">
      <h2 id="plan-dlg-title">שמירת המסלול</h2>
      <label class="fld">שם<input id="plan-name" placeholder="למשל: טבעת כלח" maxlength="50"></label>
      <label class="fld">תיקייה<input id="plan-folder" list="folders" placeholder="למשל: שוויצריה הקטנה" maxlength="40"></label>
      <datalist id="folders"></datalist>
      <div class="cf-btns"><button value="cancel" formnovalidate>חזרה לעריכה</button><button value="ok" class="primary">שמירה</button></div>
    </form>
  </dialog>

  <!-- חיפוש מקום: פס קבוע למעלה כשלא נמצאים בתוך מסלול או בתכנון -->
  <div id="search">
    <form id="search-form" action="#">
      <input id="search-input" type="search" enterkeyhint="search" placeholder="חיפוש מקום" autocomplete="off">
      <button type="button" id="search-close" aria-label="ניקוי" hidden>✕</button>
    </form>
    <ul id="search-results"></ul>
  </div>

  <!-- עיצוב רשימת המסלולים: גודל ומשקל לכל סוג טקסט, ומרווח השורות -->
  <!-- פיתוח (זמני – יימחק בסוף): נקודה קטנה משמאל למעלה – עיצוב הרשימה וזמני הפתיחה -->
  <button id="dev-dot" aria-label="פיתוח"></button>
  <dialog id="style-dlg">
    <h2>עיצוב רשימת המסלולים</h2>
    <p id="ls-perf" class="ls-perf"></p>
    <div id="ls-list"></div>
    <div class="ls-btns"><button id="ls-reset">ברירת מחדל</button><button id="ls-copy">העתקה</button><button id="ls-close" class="primary">סגור</button></div>
  </dialog>

  <!-- תמונה של מקום (מהתגיות שלו ב-OSM); נגיעה סוגרת -->
  <dialog id="photo-dlg"><img id="photo-img" alt=""><video id="photo-vid" controls playsinline preload="metadata" hidden></video><button class="ph-nav" data-d="prev" aria-label="הקודמת">›</button><button class="ph-nav" data-d="next" aria-label="הבאה">‹</button><p id="photo-cap"></p></dialog>

  <!-- אישור מחיקה: מה יקרה, ביטול / מחיקה -->
  <dialog id="confirm-dlg">
    <form method="dialog">
      <h2 id="cf-title"></h2>
      <p id="cf-text" class="muted"></p>
      <div class="cf-btns"><button value="cancel" formnovalidate>ביטול</button><button value="ok" class="danger-btn">מחיקה</button></div>
    </form>
  </dialog>



  <script src="geo.js"></script>
  <script src="osm.js"></script>
  <script src="router.js"></script>
  <script src="elev.js"></script>
  <script src="app.js"></script>
</body>
</html>
