# בונה מחדש את israel.json (המפה הכללית של כל הארץ, מ-OpenStreetMap) – אוטומטית פעם בחודש (וגם ידנית:
# Actions → overview → Run workflow). אם הנתונים השתנו: שומר ב-main ומעלה את גרסת האפליקציה (CACHE ב-sw.js),
# כך שהמפה החדשה מגיעה לטלפון לבד בפתיחה הבאה. אם לא השתנה כלום – לא נוגע בכלום.
name: overview
on:
  schedule:
    - cron: '23 2 1 * *' # ב-1 לכל חודש, 02:23 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: overview
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # קובץ מוכן של כל ישראל ופלסטין (Geofabrik, מתעדכן כל יום) – מהיר ואמין, במקום שרת Overpass הציבורי העמוס
      - run: curl -sSfL --retry 3 -o il.osm.pbf https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf && ls -la il.osm.pbf
      - run: pip install -q osmium
      - run: python3 tools/overview.py israel.json --pbf il.osm.pbf
      - name: commit + גרסה חדשה לאפליקציה
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la israel.json
          rm -f il.osm.pbf
          # הבנייה לוקחת זמן – בינתיים main אולי התקדם: מעבירים את הקובץ החדש על הגרסה העדכנית
          cp israel.json "$RUNNER_TEMP/israel.json"
          git fetch -q origin main && git reset -q --hard origin/main
          cp "$RUNNER_TEMP/israel.json" israel.json
          git diff --quiet -- israel.json && { echo "אין שינוי"; exit 0; }
          n=$(grep -oP "shvilim-v\K[0-9]+" sw.js | head -1); m=$((n + 1))
          sed -i "s/shvilim-v$n\b/shvilim-v$m/g" sw.js CLAUDE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add israel.json sw.js CLAUDE.md
          git commit -m "מפה כללית של כל הארץ (israel.json) מ-OpenStreetMap – גרסה v$m"
          git push
          # push של GITHUB_TOKEN לא מפעיל workflows אחרים – מפרסמים את האתר במפורש (בלי לבנות מחדש את המשבצות)
          gh workflow run pages.yml -f tiles=false
